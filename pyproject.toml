[project]
name = "scromfyUI_Nodes"
version = "0.1.0"
description = "ScromfyUI nodes for ComfyUI"
authors = [
    { name = "scruffynerf" }
]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.21.0",
    "Pillow>=9.0.0",
    "aiohttp>=3.8.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "largestinteriorrectangle>=0.2.0",
    "shortuuid>=1.0.0",
    "scipy>=1.10.0",
    "imageio>=2.30.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
